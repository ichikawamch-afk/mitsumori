<script data-dc-script data-props='{"brand":{"editor":"color","default":"#5B6B33","options":["#5B6B33","#1B63D1","#8A4A2F","#3A4E8C"]}}'>
class Component extends DCLogic {
  hexToRgb(hex) {
    const h = hex.replace("#", "");
    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const bigint = parseInt(full, 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
  }
  darken(hex, amt) {
    const [r, g, b] = this.hexToRgb(hex);
    const mix = (c) => Math.round(c * (1 - amt));
    return "#" + [mix(r), mix(g), mix(b)].map((v) => v.toString(16).padStart(2, "0")).join("");
  }
  renderVals() {
    const brand = this.props.brand ?? "#5B6B33";
    return { brand, brandDark: this.darken(brand, 0.34) };
  }
}
</script>
